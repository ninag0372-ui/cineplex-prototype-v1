<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cineplex - Account Creation</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <a href="index.html" class="logo">Cineplex</a>
    <div class="auth-links">
      <a href="login.html">Login + Sign up</a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <div class="auth-wrapper">
      <form id="signupForm" class="auth-box">
        <!-- Seat hold timer countdown banner shown if in checkout flow -->
        <div id="signupHoldTimerBanner" class="hold-timer-banner" style="display: none;">
          <span>⏱️ Seat held for <span id="signupHoldTimer">05:00</span> minutes</span>
        </div>

        <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem;">Account Creation</h2>

        <div class="control-group" style="margin-bottom: 1rem;">
          <label for="firstName">First name *</label>
          <input type="text" id="firstName" placeholder="First name" required />
        </div>

        <div class="control-group" style="margin-bottom: 1rem;">
          <label for="lastName">Last name *</label>
          <input type="text" id="lastName" placeholder="Last name" required />
        </div>

        <div class="control-group" style="margin-bottom: 1rem;">
          <label>Birthday</label>
          <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 0.5rem;">
            <input type="text" id="birthYear" placeholder="YYYY" maxlength="4" />
            <input type="text" id="birthMonth" placeholder="MM" maxlength="2" />
            <input type="text" id="birthDay" placeholder="DD" maxlength="2" />
          </div>
        </div>

        <div class="control-group" style="margin-bottom: 1rem;">
          <label for="address">Address</label>
          <input type="text" id="address" placeholder="Enter your address" />
        </div>

        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">* = required</p>

        <div style="margin-bottom: 1.5rem;">
          <label class="checkbox-label">
            <input type="checkbox" id="notifyOffers" />
            <span>I want to be notified of new offers and releases.</span>
          </label>
        </div>

        <button type="submit" class="btn-submit">Create Account</button>
      </form>
    </div>
  </main>

  <footer>
    <p>Cineplex Prototype - Mid-Fidelity Wireframe Design | <a href="analytics.html" style="color: var(--text-muted); text-decoration: underline;">📊 Test Analytics</a></p>
  </footer>

  <script src="js/analytics.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initSignupPage();
    });
  </script>
</body>
</html>
