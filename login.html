<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cineplex - Log In</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <a href="index.html" class="logo">Cineplex</a>
    <div class="auth-links">
      <a href="login.html">Login + Sign up</a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <div class="auth-wrapper">
      <form id="loginForm" class="auth-box">
        <!-- Seat hold timer countdown banner shown if in checkout flow -->
        <div id="loginHoldTimerBanner" class="hold-timer-banner" style="display: none;">
          <span>⏱️ Seat held for <span id="loginHoldTimer">05:00</span> minutes</span>
        </div>

        <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem;">Log In</h2>

        <div class="control-group" style="margin-bottom: 1.2rem;">
          <label for="emailInput">Email</label>
          <input type="email" id="emailInput" placeholder="Enter your email" required />
        </div>

        <div class="control-group" style="margin-bottom: 1.2rem;">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" placeholder="Enter your password" required />
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label class="checkbox-label">
            <input type="checkbox" id="keepLoggedIn" />
            <span>Keep me logged in</span>
          </label>
        </div>

        <div class="auth-buttons-row">
          <button type="button" id="createAccountBtn" class="btn-buy" style="width: auto; padding: 0.6rem 1.2rem;">create account</button>
          <button type="submit" class="btn-buy" style="width: auto; padding: 0.6rem 1.5rem; background-color: var(--accent-color); color: #fff;">Log in</button>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <p>Cineplex Prototype - Mid-Fidelity Wireframe Design | <a href="analytics.html" style="color: var(--text-muted); text-decoration: underline;">📊 Test Analytics</a></p>
  </footer>

  <script src="js/analytics.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initLoginPage();
    });
  </script>
</body>
</html>
